<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<title>New York — a personal list</title>
<meta name="description" content="A hand-kept list of places in Seattle. Personal notes only, no reviews.">
<meta name="theme-color" content="#FBF9F6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23A8442F'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.9.0/mapbox-gl.css" rel="stylesheet">
<style>
:root{
  /* paper + ink */
  --paper:#FBF9F6;
  --paper-2:#F5F1EA;
  --paper-3:#EFEAE1;
  --ink:#1C1917;
  --ink-2:#57514A;
  --ink-3:#8B8279;
  --rule:#E4DDD2;
  --rule-2:#EDE7DD;

  /* categories — dusty, not primary */
  --eat:#A8442F;
  --drink:#35636F;
  --sweets:#8A5B34;
  --music:#6B5480;
  --shop:#3E6B52;
  --groc:#8E6C22;
  --act:#9A4667;

  --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --grain:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.04'/></svg>");
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;flex-direction:column;overflow:hidden;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
h1,h2,h3{margin:0;font-weight:inherit}

/* ══════════ header ══════════ */
header{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--rule);position:relative;z-index:40}
.hrow{display:flex;align-items:flex-end;gap:26px;padding:16px 28px 12px;max-width:2000px;margin:0 auto}

.brand{flex-shrink:0;display:flex;align-items:baseline;gap:10px;line-height:1}
.brand b{
  font-family:var(--serif);font-optical-sizing:auto;font-weight:600;font-size:27px;
  letter-spacing:-.018em;font-variation-settings:"opsz" 40;
}
.brand span{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  font-weight:500;padding-bottom:2px;
}

.searchwrap{flex:1;display:flex;justify-content:center;min-width:0}
.search{
  display:flex;align-items:center;gap:9px;width:100%;max-width:400px;
  border-bottom:1px solid var(--rule);padding:5px 2px 6px;
  transition:border-color .2s;
}
.search:focus-within{border-bottom-color:var(--ink)}
.search svg{flex-shrink:0;color:var(--ink-3)}
.search input{
  border:0;outline:0;font-family:inherit;font-size:14.5px;width:100%;background:transparent;color:var(--ink);
  padding:0;
}
.search input::placeholder{color:var(--ink-3);font-style:italic;font-family:var(--serif);font-size:14px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}

.hood{flex-shrink:0;position:relative;display:flex;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:6px}
.hood select{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;outline:0;cursor:pointer;
  font-family:inherit;font-size:13.5px;color:var(--ink);padding:0 20px 0 0;
  max-width:210px;text-overflow:ellipsis;
}
.hood::after{
  content:"";position:absolute;right:3px;top:38%;width:6px;height:6px;pointer-events:none;
  border-right:1.4px solid var(--ink-2);border-bottom:1.4px solid var(--ink-2);
  transform:translateY(-60%) rotate(45deg);
}

/* filter row — quiet text, not chips */
.filters{
  display:flex;gap:22px;padding:0 28px 0;overflow-x:auto;scrollbar-width:none;
  max-width:2000px;margin:0 auto;align-items:stretch;
}
.filters::-webkit-scrollbar{display:none}
.filt{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
  padding:9px 0 10px;font-size:13px;color:var(--ink-3);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .16s,border-color .16s;
}
.filt:hover{color:var(--ink-2)}
.filt .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;opacity:.75;transition:opacity .16s}
.filt .n{font-size:11px;color:var(--ink-3);opacity:.8}
.filt.on{color:var(--ink);border-bottom-color:var(--ink)}
.filt.on .dot{opacity:1}
.filt.on .n{color:var(--ink-3)}

/* ══════════ layout ══════════ */
main{flex:1 1 auto;display:flex;min-height:0;position:relative}
#listpane{
  width:43%;max-width:720px;min-width:370px;overflow-y:auto;overscroll-behavior:contain;
  border-right:1px solid var(--rule);scroll-behavior:smooth;
  background-color:var(--paper);background-image:var(--grain);
}
#mappane{flex:1;position:relative;background:var(--paper-3)}
#map{position:absolute;inset:0}
.mapboxgl-canvas{filter:sepia(.14) saturate(.82) brightness(1.03) contrast(.97)}

/* ══════════ list ══════════ */
.listhead{padding:26px 30px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.listhead h1{
  font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-.02em;line-height:1;
  font-variation-settings:"opsz" 48;
}
.listhead h1 em{font-style:italic;font-weight:400}
.listhead .sub{font-size:12.5px;color:var(--ink-3);margin-top:8px;font-family:var(--serif);font-style:italic}
.moveto{
  display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);cursor:pointer;
  flex-shrink:0;user-select:none;padding-bottom:3px;
}
.moveto input{accent-color:var(--ink);width:14px;height:14px;cursor:pointer;margin:0}

.cards{padding:14px 0 70px}

.grp{
  display:flex;align-items:baseline;gap:12px;padding:20px 30px 7px;
  position:sticky;top:0;z-index:3;
  background:var(--paper);
}
.grp::after{content:"";flex:1;height:1px;background:var(--rule)}
.grp span{
  font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--ink-2);
}
.grp em{font-style:normal;font-size:11px;color:var(--ink-3);order:3}

.card{
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;
  padding:14px 30px 15px;text-align:left;width:100%;position:relative;
  transition:background .14s;
}
.card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .14s;
}
.card+.card{box-shadow:inset 0 1px 0 var(--rule-2)}
.card:hover,.card.hot{background:rgba(28,25,23,.028)}
.card.sel{background:rgba(28,25,23,.05)}
.card.sel::before{background:var(--accent,var(--ink))}

.card h3{font-size:16.5px;font-weight:500;letter-spacing:-.011em;line-height:1.28}
.c-type{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500;
}
.c-type i{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.c-note{
  font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-2);
  margin-top:8px;line-height:1.5;font-variation-settings:"opsz" 14;
}
.c-side{text-align:right;flex-shrink:0;padding-top:1px}
.c-price{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.c-multi{
  display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  margin-top:6px;
}

.endnote{
  padding:34px 30px 10px;font-family:var(--serif);font-style:italic;font-size:13.5px;
  color:var(--ink-3);line-height:1.6;border-top:1px solid var(--rule);margin:26px 30px 0;
}
.empty{padding:70px 30px;color:var(--ink-3);font-size:14px;text-align:center;line-height:1.7}
.empty b{
  display:block;color:var(--ink);font-family:var(--serif);font-size:19px;font-weight:400;
  margin-bottom:8px;font-style:italic;
}

/* ══════════ markers ══════════ */
.mk{cursor:pointer;will-change:transform}
.mk .dot{
  width:11px;height:11px;border-radius:50%;border:2px solid var(--paper);
  box-shadow:0 1px 3px rgba(28,25,23,.34);transition:transform .16s;
}
.mk .lab{
  display:none;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--rule);
  border-radius:3px;padding:4px 9px 4px 7px;box-shadow:0 2px 8px rgba(28,25,23,.13);
  white-space:nowrap;font-size:12px;font-weight:500;letter-spacing:-.004em;max-width:210px;
  transition:transform .16s;
}
.mk .lab i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.mk .lab span{overflow:hidden;text-overflow:ellipsis}
.mk .lab em{
  font-family:var(--serif);font-style:italic;font-weight:400;color:var(--ink-3);font-size:11.5px;
}
body.zlab .mk .dot{display:none}
body.zlab .mk .lab{display:inline-flex}
.mk.clash .lab{display:none}
body.zlab .mk.clash .dot{display:block;width:8px;height:8px;border-width:1.5px;opacity:.7}
body.zlab .mk.clash.sel .lab,body.zlab .mk.clash:hover .lab{display:inline-flex}
body.zlab .mk.clash.sel .dot,body.zlab .mk.clash:hover .dot{display:none}
.mk:hover{z-index:5}
.mk:hover .dot{transform:scale(1.3)}
.mk:hover .lab{transform:scale(1.05)}
.mk.hot{z-index:6}
.mk.hot .dot{transform:scale(1.4)}
.mk.hot .lab{transform:scale(1.06);box-shadow:0 4px 14px rgba(28,25,23,.2)}
.mk.sel{z-index:8}
.mk.sel .dot{transform:scale(1.45)}
.mk.sel .lab{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:scale(1.08)}
.mk.sel .lab em{color:rgba(251,249,246,.68)}

/* ══════════ detail sheet ══════════ */
#sheet{
  position:absolute;left:22px;bottom:22px;width:340px;max-width:calc(100% - 44px);
  background:var(--paper);border:1px solid var(--rule);border-radius:4px;
  box-shadow:0 10px 34px rgba(28,25,23,.16);z-index:20;
  opacity:0;transform:translateY(12px);pointer-events:none;
  transition:opacity .2s ease,transform .2s cubic-bezier(.2,.8,.3,1);
  background-image:var(--grain);
}
#sheet.on{opacity:1;transform:none;pointer-events:auto}
.sh-body{padding:20px 22px 22px;position:relative}
.sh-cat{
  display:flex;align-items:center;gap:7px;
  font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;color:var(--ink-3);
}
.sh-cat i{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#shname{
  font-family:var(--serif);font-size:23px;font-weight:500;letter-spacing:-.018em;line-height:1.16;
  margin:9px 0 2px;font-variation-settings:"opsz" 36;padding-right:22px;
}
.sh-meta{font-size:12.5px;color:var(--ink-3);margin-bottom:15px}
.sh-row{
  display:flex;gap:9px;font-size:13px;color:var(--ink-2);line-height:1.5;padding:7px 0;
  border-top:1px solid var(--rule-2);
}
.sh-row svg{flex-shrink:0;margin-top:2px;color:var(--ink-3)}
.sh-note{
  font-family:var(--serif);font-style:italic;font-size:14px;line-height:1.55;color:var(--ink);
  margin-top:14px;padding-left:13px;border-left:2px solid var(--rule);
}
#shclose{
  position:absolute;top:16px;right:16px;width:22px;height:22px;
  display:grid;place-items:center;color:var(--ink-3);font-size:17px;line-height:1;border-radius:50%;
}
#shclose:hover{color:var(--ink);background:var(--paper-2)}

/* ══════════ map ui ══════════ */
.mapbtns{position:absolute;top:18px;right:18px;z-index:15;display:flex;flex-direction:column;gap:8px}
.mbtn{
  width:34px;height:34px;border-radius:3px;background:var(--paper);border:1px solid var(--rule);
  box-shadow:0 1px 4px rgba(28,25,23,.1);display:grid;place-items:center;color:var(--ink-2);
  transition:color .15s,background .15s;
}
.mbtn:hover{background:var(--paper-2);color:var(--ink)}
.hint{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:14;
  background:var(--ink);color:var(--paper);font-size:12px;padding:7px 15px;border-radius:3px;
  box-shadow:0 3px 12px rgba(28,25,23,.22);pointer-events:none;transition:opacity .5s;
  font-family:var(--serif);font-style:italic;white-space:nowrap;
}
.hint.off{opacity:0}
.mapboxgl-ctrl-logo,.mapboxgl-ctrl-attrib{font-size:10px}
.mapboxgl-ctrl-attrib.mapboxgl-compact{background:rgba(251,249,246,.9)}

/* ══════════ mobile ══════════ */
#mobtog{display:none}
@media (max-width:900px){
  .hrow{padding:13px 17px 10px;gap:14px;flex-wrap:wrap}
  .brand b{font-size:23px}
  .brand span{display:none}
  .searchwrap{order:3;flex-basis:100%}
  .search{max-width:none}
  .filters{padding:0 17px;gap:18px}
  .hood select{max-width:150px;font-size:13px}
  main{display:block}
  #listpane{width:100%;max-width:none;min-width:0;height:100%;border:0}
  #mappane{position:absolute;inset:0;z-index:5;visibility:hidden}
  body.mapview #listpane{visibility:hidden}
  body.mapview #mappane{visibility:visible}
  .listhead{padding:20px 20px 4px}
  .grp{padding:18px 20px 7px}
  .card{padding:13px 20px 14px}
  .endnote{margin:26px 20px 0;padding:30px 0 10px}
  #sheet{left:12px;right:12px;bottom:12px;width:auto;max-width:none}
  #mobtog{
    display:flex;align-items:center;gap:8px;position:fixed;bottom:24px;left:50%;
    transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:11px 21px;font-size:13.5px;font-weight:500;
    box-shadow:0 5px 18px rgba(28,25,23,.28);
  }
  .hint{bottom:78px}
  .mapbtns{top:12px;right:12px}
}
</style>
</head>

cket":"Drink","lon":-73.95019,"lat":40.7181,"price":"$8 drinks","notes":"free shows in the back car","address":"709 Lorimer St, Brooklyn, NY"},{"name":"Bar Great Harry","neighborhood":"Carroll Gardens, Brooklyn","type":"Beer Bar","bucket":"Drink","lon":-73.99358,"lat":40.68245,"price":"$9 beers","notes":"rotating taps","address":"280 Smith St, Brooklyn, NY"},{"name":"Doris","neighborhood":"Bed-Stuy, Brooklyn","type":"Cocktail Bar","bucket":"Drink","lon":-73.95735,"lat":40.68136,"price":"$14 cocktails","notes":"big backyard","address":"1088 Fulton St, Brooklyn, NY"},{"name":"The Long Island Bar","neighborhood":"Cobble Hill, Brooklyn","type":"Cocktail Bar","bucket":"Drink","lon":-73.99641,"lat":40.69063,"price":"$17 cocktails","notes":"gimlet, opens 5pm","address":"110 Atlantic Ave, Brooklyn, NY"},{"name":"Hotel Delmano","neighborhood":"Williamsburg, Brooklyn","type":"Cocktail Bar","bucket":"Drink","lon":-73.95802,"lat":40.71971,"price":"$18 cocktails","notes":"no reservations","address":"82 Berry St, Brooklyn, NY"},{"name":"Place des Fetes","neighborhood":"Clinton Hill, Brooklyn","type":"Natural Wine","bucket":"Drink","lon":-73.9629,"lat":40.68693,"price":"$18 glasses","notes":"small plates","address":"212 Greene Ave, Brooklyn, NY"},{"name":"Public Records","neighborhood":"Gowanus, Brooklyn","type":"Listening Bar","bucket":"Drink","lon":-73.98647,"lat":40.68207,"price":"$16 drinks","notes":"hi-fi sound room","address":"233 Butler St, Brooklyn, NY"},{"name":"Trad Room","neighborhood":"Bed-Stuy, Brooklyn","type":"Sake Bar","bucket":"Drink","lon":-73.92944,"lat":40.68389,"price":"$40 pp","notes":"sake flights","address":"266 Malcolm X Blvd, Brooklyn, NY"},{"name":"Market Hotel","neighborhood":"Bushwick, Brooklyn","type":"Music Venue","bucket":"Music & Film","lon":-73.93459,"lat":40.697,"price":"$20-30 shows","notes":"above the M train","address":"1140 Myrtle Ave, Brooklyn, NY"},{"name":"Barbes","neighborhood":"Park Slope, Brooklyn","type":"Music Venue","bucket":"Music & Film","lon":-73.98384,"lat":40.6678,"price":"$10 suggested","notes":"pass the hat","address":"376 9th St, Brooklyn, NY"},{"name":"Spectacle Theater","neighborhood":"Williamsburg, Brooklyn","type":"Movie Theater","bucket":"Music & Film","lon":-73.97776,"lat":40.71109,"price":"$5 screenings","notes":"cash only, 40 seats","address":"East River Promenade, New York, NY"},{"name":"Light Industry","neighborhood":"Greenpoint, Brooklyn","type":"Movie Theater","bucket":"Music & Film","lon":-73.93434,"lat":40.71057,"price":"$12 screenings","notes":"one night only, 16mm","address":"361 Stagg St Ste 407, Brooklyn, NY"},{"name":"Human Head Records","neighborhood":"Bushwick, Brooklyn","type":"Record Store","bucket":"Music & Film","lon":-73.93635,"lat":40.709,"price":"Varies","notes":"used bins","address":"289 Meserole St, Brooklyn, NY"},{"name":"Front General Store","neighborhood":"Dumbo, Brooklyn","type":"Vintage","bucket":"Shopping","lon":-73.98728,"lat":40.7025,"price":"Varies","notes":"vintage workwear","address":"143 Front St, Brooklyn, NY"},{"name":"10 Ft Single by Stella Dallas","neighborhood":"Williamsburg, Brooklyn","type":"Vintage","bucket":"Shopping","lon":-73.95356,"lat":40.71443,"price":"Varies","notes":"denim, military surplus","address":"285 N 6th St, Brooklyn, NY"},{"name":"Melody Lanes","neighborhood":"Sunset Park, Brooklyn","type":"Bowling","bucket":"Activities","lon":-74.00306,"lat":40.65271,"price":"$8 per game","notes":"bar in back","address":"461 37th St, Brooklyn, NY"}];

<script>
/* Seattle map — personal list. No external reviews or ratings; notes are the author's own. */
(function () {
  "use strict";

  var BUCKETS = [
    { key: "Eat",             color: "#A8442F" },
    { key: "Drink",           color: "#35636F" },
    { key: "Coffee & Sweets", color: "#8A5B34" },
    { key: "Music & Film",    color: "#6B5480" },
    { key: "Shopping",        color: "#3E6B52" },
    { key: "Groceries",       color: "#8E6C22" },
    { key: "Activities",      color: "#9A4667" }
  ];
  var BC = {}; BUCKETS.forEach(function (b) { BC[b.key] = b; });

  /* the sheet spells a few neighborhoods more than one way; settle them here
     so the filter and the group headings don't split in two. */
  var HOOD_FIX = {
    "Capitol HIll": "Capitol Hill",
    "Greenlake": "Green Lake",
    "Lower Queen Anne (Uptown)": "Lower Queen Anne",
    "Many": "Around town"
  };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function shorten(s, n) {
    s = String(s);
    return s.length <= n ? s : s.slice(0, n - 1).replace(/[\s,;:.-]+$/, "") + "…";
  }

  var HOME = { center: [-73.94, 40.70], zoom: 10.4 };
  var LABEL_ZOOM = 13.2;   // pins become named labels
  var NOTE_ZOOM  = 14.6;   // labels also carry the note

  var state = { bucket: "All", hood: "All", q: "", sel: null, moveSearch: false, bounds: null };
  var markers = [], cardEls = [];

  var $ = function (id) { return document.getElementById(id); };
  var cardsEl = $("cards"), countEl = $("count"), subEl = $("sub");

  PLACES.forEach(function (p, i) {
    p._i = i;
    if (HOOD_FIX[p.neighborhood]) p.neighborhood = HOOD_FIX[p.neighborhood];
  });

  /* ──────────────── map ──────────────── */
  mapboxgl.accessToken = MAPBOX_TOKEN;
  var map = new mapboxgl.Map({
    container: "map",
    style: "mapbox://styles/mapbox/light-v11",
    center: HOME.center,
    zoom: HOME.zoom,
    minZoom: 8,
    maxZoom: 18,
    attributionControl: true,
    cooperativeGestures: false
  });
  map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), "bottom-right");
  map.addControl(new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: false }), "bottom-right");

  /* ──────────────── markers ──────────────── */
  PLACES.forEach(function (p, i) {
    var b = BC[p.bucket] || BUCKETS[0];
    var el = document.createElement("div");
    el.className = "mk";
    el.innerHTML =
      '<div class="dot" style="background:' + b.color + '"></div>' +
      '<div class="lab"><i style="background:' + b.color + '"></i>' +
      '<span>' + esc(p.name) + '</span>' +
      (p.notes ? ' <em class="nt">' + esc(shorten(p.notes, 34)) + '</em>' : '') +
      '</div>';
    el.addEventListener("click", function (e) { e.stopPropagation(); select(i, true); });
    el.addEventListener("mouseenter", function () { hover(i, true); });
    el.addEventListener("mouseleave", function () { hover(i, false); });
    var m = new mapboxgl.Marker({ element: el, anchor: "center" })
      .setLngLat([p.lon, p.lat]).addTo(map);
    markers.push({ el: el, m: m, p: p });
  });

  function applyZoomClass() {
    var z = map.getZoom();
    document.body.classList.toggle("zlab", z >= LABEL_ZOOM);
    var showNotes = z >= NOTE_ZOOM;
    markers.forEach(function (mk) {
      var nt = mk.el.querySelector(".nt");
      if (nt) nt.style.display = showNotes ? "" : "none";
    });
  }

  /* Hide labels that would overlap, so the map never looks like a pile of pills.
     Priority: the selected place first, then whatever is nearest the map centre. */
  var declutterPending = false;
  function declutter() {
    declutterPending = false;
    if (!document.body.classList.contains("zlab")) {
      markers.forEach(function (mk) { mk.el.classList.remove("clash"); });
      return;
    }
    var pane = document.getElementById("map").getBoundingClientRect();
    var cx = pane.left + pane.width / 2, cy = pane.top + pane.height / 2;
    var live = [];
    markers.forEach(function (mk) {
      mk.el.classList.remove("clash");
      if (mk.el.style.display === "none") return;
      var r = mk.el.getBoundingClientRect();
      if (r.width === 0 || r.right < pane.left || r.left > pane.right ||
          r.bottom < pane.top || r.top > pane.bottom) return;
      var dx = (r.left + r.right) / 2 - cx, dy = (r.top + r.bottom) / 2 - cy;
      live.push({ mk: mk, r: r, d: Math.sqrt(dx * dx + dy * dy), sel: mk.p._i === state.sel });
    });
    live.sort(function (a, b) { return (b.sel - a.sel) || (a.d - b.d); });
    var placed = [];
    live.forEach(function (o) {
      var r = o.r, pad = 3, hit = false;
      for (var i = 0; i < placed.length; i++) {
        var q = placed[i];
        if (r.left - pad < q.right && r.right + pad > q.left &&
            r.top - pad < q.bottom && r.bottom + pad > q.top) { hit = true; break; }
      }
      if (hit) o.mk.el.classList.add("clash");
      else placed.push(r);
    });
  }
  function queueDeclutter() {
    if (declutterPending) return;
    declutterPending = true;
    requestAnimationFrame(declutter);
  }

  map.on("zoom", function () { applyZoomClass(); queueDeclutter(); });
  map.on("move", queueDeclutter);
  map.on("load", function () { applyZoomClass(); render(); queueDeclutter(); });
  map.on("moveend", function () {
    if (state.moveSearch) { state.bounds = map.getBounds(); render(); }
    queueDeclutter();
  });
  map.on("click", function () { select(null); });

  /* ──────────────── filtering ──────────────── */
  function visible() {
    var q = state.q.trim().toLowerCase();
    return PLACES.filter(function (p) {
      if (state.bucket !== "All" && p.bucket !== state.bucket) return false;
      if (state.hood !== "All" && p.neighborhood !== state.hood) return false;
      if (q) {
        var hay = (p.name + " " + p.type + " " + p.neighborhood + " " + (p.notes || "") + " " + (p.price || "")).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      if (state.moveSearch && state.bounds) {
        var b = state.bounds;
        if (p.lon < b.getWest() || p.lon > b.getEast() || p.lat < b.getSouth() || p.lat > b.getNorth()) return false;
      }
      return true;
    });
  }

  function render() {
    var list = visible();
    var on = {}; list.forEach(function (p) { on[p._i] = 1; });

    markers.forEach(function (mk) {
      mk.el.style.display = on[mk.p._i] ? "" : "none";
    });

    countEl.innerHTML = list.length + (list.length === 1 ? " <em>place</em>" : " <em>places</em>");
    var bits = [];
    if (state.bucket !== "All") bits.push(state.bucket.toLowerCase());
    if (state.hood !== "All") bits.push("in " + state.hood);
    if (state.q.trim()) bits.push("matching “" + state.q.trim() + "”");
    subEl.textContent = bits.length ? bits.join(" ") : "across the five boroughs";

    cardsEl.innerHTML = "";
    cardEls = [];
    if (!list.length) {
      cardsEl.innerHTML = '<div class="empty"><b>Nothing here yet</b>Try another category, another neighborhood, or a looser search.</div>';
      return;
    }

    /* group by neighborhood — it reads like the list it is, rather than a feed */
    var LAST = "Around town";   // the chains sit at the bottom, not the top
    var sorted = list.slice().sort(function (a, b) {
      if (a.neighborhood !== b.neighborhood) {
        if (a.neighborhood === LAST) return 1;
        if (b.neighborhood === LAST) return -1;
        return a.neighborhood < b.neighborhood ? -1 : 1;
      }
      return a.name < b.name ? -1 : 1;
    });
    var counts = {};
    sorted.forEach(function (p) { counts[p.neighborhood] = (counts[p.neighborhood] || 0) + 1; });

    var frag = document.createDocumentFragment(), lastHood = null;
    sorted.forEach(function (p) {
      if (p.neighborhood !== lastHood) {
        lastHood = p.neighborhood;
        var g = document.createElement("div");
        g.className = "grp";
        g.innerHTML = "<span>" + esc(p.neighborhood) + "</span><em>" + counts[p.neighborhood] + "</em>";
        frag.appendChild(g);
      }
      var b = BC[p.bucket] || BUCKETS[0];
      var el = document.createElement("button");
      el.className = "card";
      el.type = "button";
      el.style.setProperty("--accent", b.color);
      el.innerHTML =
        '<div class="c-main">' +
          '<h3>' + esc(p.name) + '</h3>' +
          '<div class="c-type"><i style="background:' + b.color + '"></i>' + esc(p.type) + '</div>' +
          (p.notes ? '<div class="c-note">' + esc(p.notes) + '</div>' : '') +
        '</div>' +
        '<div class="c-side">' +
          (p.price ? '<div class="c-price">' + esc(p.price) + '</div>' : '') +
          (p.multi ? '<span class="c-multi">several</span>' : '') +
        '</div>';
      el.addEventListener("click", function () { select(p._i, false, true); });
      el.addEventListener("mouseenter", function () { hover(p._i, true); });
      el.addEventListener("mouseleave", function () { hover(p._i, false); });
      cardEls[p._i] = el;
      frag.appendChild(el);
    });
    cardsEl.appendChild(frag);

    var end = document.createElement("div");
    end.className = "endnote";
    end.textContent = "That’s the whole list. No ratings and no reviews, just places I’ve been and what I remember about them.";
    cardsEl.appendChild(end);

    if (state.sel != null && cardEls[state.sel]) cardEls[state.sel].classList.add("sel");
    queueDeclutter();
  }

  function hover(i, on) {
    if (markers[i]) markers[i].el.classList.toggle("hot", on);
    if (cardEls[i]) cardEls[i].classList.toggle("hot", on);
  }

  /* ──────────────── selection + detail ──────────────── */
  var sheet = $("sheet");
  var PIN_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  var TAG_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6.5c0-2-2.2-3-5-3s-5 1-5 3 2.2 2.8 5 3.5 5 1.5 5 3.5-2.2 3-5 3-5-1-5-3"/></svg>';

  function select(i, fromMarker, fromCard) {
    if (state.sel != null) {
      if (markers[state.sel]) markers[state.sel].el.classList.remove("sel");
      if (cardEls[state.sel]) cardEls[state.sel].classList.remove("sel");
    }
    state.sel = i;
    if (i == null) { sheet.classList.remove("on"); return; }

    var p = PLACES[i], b = BC[p.bucket] || BUCKETS[0];
    if (markers[i]) markers[i].el.classList.add("sel");
    if (cardEls[i]) {
      cardEls[i].classList.add("sel");
      if (fromMarker) cardEls[i].scrollIntoView({ block: "center", behavior: "smooth" });
    }

    $("shcat").innerHTML = '<i style="background:' + b.color + '"></i>' + esc(p.bucket);
    $("shname").textContent = p.name;
    $("shmeta").textContent = p.type + " · " + p.neighborhood;

    var addr = $("shaddr");
    addr.innerHTML = p.address
      ? PIN_SVG + '<div>' + esc(p.address) + (p.multi ? ' <span style="color:var(--ink-3)">(one of several)</span>' : '') + '</div>'
      : "";
    addr.style.display = p.address ? "" : "none";

    var price = $("shprice");
    price.innerHTML = p.price ? TAG_SVG + '<div>' + esc(p.price) + '</div>' : "";
    price.style.display = p.price ? "" : "none";

    var noteEl = $("shnote");
    if (p.notes) { noteEl.textContent = p.notes; noteEl.style.display = ""; }
    else { noteEl.style.display = "none"; }
    sheet.classList.add("on");
    killHint();

    if (fromCard) {
      if (window.innerWidth <= 900) { document.body.classList.add("mapview"); syncToggle(); }
      map.flyTo({ center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), NOTE_ZOOM), speed: 1.5, curve: 1.3, essential: true });
    } else if (fromMarker) {
      var z = map.getZoom();
      if (z < LABEL_ZOOM) map.easeTo({ center: [p.lon, p.lat], zoom: LABEL_ZOOM + 0.4, duration: 600 });
    }
  }
  $("shclose").addEventListener("click", function (e) { e.stopPropagation(); select(null); });
  sheet.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") select(null); });

  /* ──────────────── controls ──────────────── */
  var filtersEl = $("filters");
  (function buildFilters() {
    var c = { All: PLACES.length };
    PLACES.forEach(function (p) { c[p.bucket] = (c[p.bucket] || 0) + 1; });
    var items = [{ key: "All", color: null }].concat(BUCKETS);
    items.forEach(function (b) {
      var el = document.createElement("button");
      el.className = "filt" + (b.key === "All" ? " on" : "");
      el.innerHTML = (b.color ? '<span class="dot" style="background:' + b.color + '"></span>' : "") +
                     esc(b.key) + ' <span class="n">' + (c[b.key] || 0) + "</span>";
      el.addEventListener("click", function () {
        state.bucket = b.key;
        [].forEach.call(filtersEl.children, function (x) { x.classList.remove("on"); });
        el.classList.add("on");
        select(null); render(); $("listpane").scrollTop = 0;
      });
      filtersEl.appendChild(el);
    });
  })();

  (function buildHoods() {
    var hs = {};
    PLACES.forEach(function (p) { hs[p.neighborhood] = (hs[p.neighborhood] || 0) + 1; });
    var keys = Object.keys(hs).sort();
    var sel = $("hood");
    sel.innerHTML = '<option value="All">Every neighborhood</option>' +
      keys.map(function (k) { return '<option value="' + esc(k) + '">' + esc(k) + " (" + hs[k] + ")</option>"; }).join("");
    sel.addEventListener("change", function () {
      state.hood = sel.value;
      select(null); render(); $("listpane").scrollTop = 0;
      var list = visible();
      if (list.length) {
        var bb = new mapboxgl.LngLatBounds();
        list.forEach(function (p) { bb.extend([p.lon, p.lat]); });
        map.fitBounds(bb, { padding: 90, maxZoom: 15, duration: 800 });
      }
    });
  })();

  var qEl = $("q"), qt;
  qEl.addEventListener("input", function () {
    clearTimeout(qt);
    qt = setTimeout(function () { state.q = qEl.value; select(null); render(); $("listpane").scrollTop = 0; }, 140);
  });

  $("movesearch").addEventListener("change", function () {
    state.moveSearch = this.checked;
    state.bounds = this.checked ? map.getBounds() : null;
    render();
  });

  $("reset").addEventListener("click", function () {
    select(null);
    map.flyTo({ center: HOME.center, zoom: HOME.zoom, speed: 1.4, essential: true });
  });

  /* ──────────────── mobile toggle ──────────────── */
  function syncToggle() {
    var onMap = document.body.classList.contains("mapview");
    $("mobtxt").textContent = onMap ? "List" : "Map";
  }
  $("mobtog").addEventListener("click", function () {
    document.body.classList.toggle("mapview");
    syncToggle();
    if (document.body.classList.contains("mapview")) setTimeout(function () { map.resize(); }, 60);
  });
  syncToggle();

  /* ──────────────── hint ──────────────── */
  var hintEl = $("hint"), hintDone = false;
  function killHint() { if (!hintDone && hintEl) { hintDone = true; hintEl.classList.add("off"); } }
  map.on("zoom", function () { if (map.getZoom() >= LABEL_ZOOM) killHint(); });
  setTimeout(killHint, 7000);

  window.addEventListener("resize", function () { map.resize(); queueDeclutter(); });
  render();
})();

</script>
</body>
</html>
