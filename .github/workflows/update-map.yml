name: Update map from spreadsheet

# Runs every Monday at 8am Pacific, whenever you click "Run workflow", and whenever a build file changes.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build/*-source.txt"
      - "build/trip-source.json"
      - "build/build-*.mjs"
      - "build/template.html"
      - ".github/workflows/update-map.yml"

# lets the action commit the rebuilt pages back to the repo
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the Seattle site from the sheet
        run: node build/build.mjs

      - name: Rebuild the New York page
        run: node build/build-nyc.mjs

      - name: Rebuild the Colorado page
        run: node build/build-colorado.mjs

      - name: Rebuild the Manitou trip page
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: node build/build-trip.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html nyc/index.html colorado/index.html manitou/index.html build/coords.json build/unpinned.txt build/nyc-coords.json build/nyc-unpinned.txt build/colorado-coords.json build/colorado-unpinned.txt build/trip-cache.json && [ -z "$(git status --porcelain nyc colorado manitou)" ]; then
            echo "No changes - everything matches what is already published."
            exit 0
          fi
          git config user.name  "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add -A index.html nyc colorado manitou build/coords.json build/unpinned.txt build/nyc-coords.json build/nyc-unpinned.txt build/colorado-coords.json build/colorado-unpinned.txt build/trip-cache.json
          git commit -m "Update maps"
          git push
