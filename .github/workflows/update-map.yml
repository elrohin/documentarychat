name: Update map from spreadsheet

# Runs every Monday at 8am Pacific, and whenever you click "Run workflow".
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

# lets the action commit the rebuilt index.html back to the repo
permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild the site from the sheet
        run: node build/build.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html build/coords.json build/unpinned.txt; then
            echo "No changes - the sheet matches what is already published."
            exit 0
          fi
          git config user.name  "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add index.html build/coords.json build/unpinned.txt
          git commit -m "Update map from spreadsheet"
          git push
